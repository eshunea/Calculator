<body>

    <main class="calculator">
        <h1>StackCalc</h1>
        <p class="subtitle">Postfix Expression Calculator</p>

        <section class="display">
            <label for="expression">ENTER POSTFIX EXPRESSION</label>
            <input
                type="text"
                id="expression"
                placeholder="e.g. 5 3 +"
                autocomplete="off"
            >

            <div class="result-box">
                <div class="result-label">RESULT</div>
                <div id="result">0</div>
            </div>
        </section>

        <div class="keypad">
            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key operator" data-value="+">+</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key operator" data-value="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key operator" data-value="*">×</button>

            <button class="key clear" id="clearButton">AC</button>
            <button class="key" data-value="0">0</button>
            <button class="key" data-value=" ">Space</button>
            <button class="key operator" data-value="/">÷</button>
        </div>

        <button class="calculate" id="calculateButton">
            Calculate
        </button>

        <section class="stack-section">
            <div class="stack-heading">
                <span>Stack Memory</span>
                <span id="stackCount">0 items</span>
            </div>

            <div id="stack">
                <div class="empty">Your stack is empty</div>
            </div>
        </section>

        <div id="message" role="status"></div>

        <p class="hint">
            Enter numbers and operators in postfix order.<br>
            Example: <strong>5 3 +</strong> = 8<br>
            <strong>LIFO:</strong> Last In, First Out
        </p>
    </main>

    <script>
        const expressionInput = document.getElementById("expression");
        const resultDisplay = document.getElementById("result");
        const stackDisplay = document.getElementById("stack");
        const stackCount = document.getElementById("stackCount");
        const message = document.getElementById("message");

        document.querySelectorAll("[data-value]").forEach(button => {
            button.addEventListener("click", () => {
                expressionInput.value += button.dataset.value;
                expressionInput.focus();
            });
        });

        document.getElementById("clearButton").addEventListener("click", clearCalculator);

        document.getElementById("calculateButton").addEventListener("click", calculate);

        expressionInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                calculate();
            }
        });

        function clearCalculator() {
            expressionInput.value = "";
            resultDisplay.textContent = "0";
            message.textContent = "";
            renderStack([]);
            expressionInput.focus();
        }

        function renderStack(stack) {
            stackDisplay.innerHTML = "";

            stackCount.textContent =
                stack.length + (stack.length === 1 ? " item" : " items");

            if (stack.length === 0) {
                stackDisplay.innerHTML =
                    '<div class="empty">Your stack is empty</div>';
                return;
            }

            stack.forEach(value => {
                const item = document.createElement("div");
                item.className = "stack-item";
                item.textContent = value;
                stackDisplay.appendChild(item);
            });
        }

        function calculate() {
            const expression = expressionInput.value.trim();

            resultDisplay.textContent = "—";
            message.textContent = "";

            if (!expression) {
                message.textContent = "Please enter an expression.";
                renderStack([]);
                return;
            }

            const stack = [];
            const tokens = expression.split(/\s+/);
            const operators = ["+", "-", "*", "/"];

            try {
                for (const token of tokens) {
                    if (/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(token)) {
                        stack.push(Number(token));
                    } else if (operators.includes(token)) {
                        if (stack.length < 2) {
                            throw new Error("Not enough numbers for " + token);
                        }

                        const second = stack.pop();
                        const first = stack.pop();
                        let answer;

                        switch (token) {
                            case "+":
                                answer = first + second;
                                break;
                            case "-":
                                answer = first - second;
                                break;
                            case "*":
                                answer = first * second;
                                break;
                            case "/":
                                if (second === 0) {
                                    throw new Error("Cannot divide by zero.");
                                }
                                answer = first / second;
                                break;
                        }

                        if (!Number.isFinite(answer)) {
                            throw new Error("The result is too large.");
                        }

                        stack.push(answer);
                    } else {
                        throw new Error("Invalid entry: " + token);
                    }

                    renderStack(stack);
                }

                if (stack.length !== 1) {
                    throw new Error(
                        "Invalid expression. Check your numbers and operators."
                    );
                }

                const finalAnswer = stack[0];
                resultDisplay.textContent =
                    Number(finalAnswer.toPrecision(12)).toString();

                message.textContent = "Calculation completed successfully!";
            } catch (error) {
                resultDisplay.textContent = "Error";
                message.textContent = error.message;
            }
        }

        renderStack([]);
    </script>

</body>
</html>
