<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postfix Calculator</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #e3e9ec;
    --panel: #f6f8f9;
    --ink: #14232b;
    --muted: #5d7079;
    --line: #c3cfd5;
    --key: #ffffff;
    --key-press: #d3dde2;
    --op: #14232b;
    --op-text: #f6f8f9;
    --accent: #2f4bff;
    --accent-text: #ffffff;
    --error: #b3261e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1a20;
      --panel: #16252d;
      --ink: #e6eef1;
      --muted: #8ea0a8;
      --line: #294049;
      --key: #1f323b;
      --key-press: #2b434e;
      --op: #e6eef1;
      --op-text: #0f1a20;
      --accent: #7f93ff;
      --accent-text: #0f1a20;
      --error: #ff8a80;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }

  .calc {
    width: 100%;
    max-width: 380px;
  }

  h1 {
    margin: 0 0 12px 4px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* ---------- Stack display ---------- */
  .tape {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px 16px 10px;
    margin-bottom: 12px;
  }

  .stack {
    list-style: none;
    margin: 0;
    padding: 0;
    height: 216px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    scrollbar-width: thin;
  }

  .stack li {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    align-items: baseline;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line);
    flex-shrink: 0;
  }
  .stack .level { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
  .stack .value {
    font-family: var(--mono);
    font-size: 1.25rem;
    text-align: right;
    overflow-wrap: anywhere;
  }
  .stack li.top .value { font-size: 1.6rem; font-weight: 700; }
  .stack li.top .level { color: var(--accent); font-weight: 700; }

  .stack li.new { animation: land 160ms ease-out; }
  @keyframes land {
    from { transform: translateY(10px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .empty {
    margin: auto 0 0;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
    padding-bottom: 8px;
  }

  .entry {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    align-items: center;
    padding-top: 10px;
    min-height: 52px;
  }
  .entry .level { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
  .entry .typed {
    font-family: var(--mono);
    font-size: 1.6rem;
    text-align: right;
    min-height: 1.6em;
  }
  .entry .typed::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 1.1em;
    margin-left: 3px;
    vertical-align: -0.15em;
    background: var(--accent);
  }

  .message {
    min-height: 1.3em;
    margin: 6px 0 0;
    font-size: 0.85rem;
    color: var(--error);
    text-align: right;
  }

  /* ---------- Keypad ---------- */
  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    font: inherit;
    font-family: var(--mono);
    font-size: 1.25rem;
    min-height: 56px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--key);
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--key-press); transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  button.op { background: var(--op); color: var(--op-text); border-color: var(--op); }
  button.op:active { opacity: 0.85; background: var(--op); }
  button.stackop { font-size: 0.9rem; font-family: var(--sans); font-weight: 600; color: var(--muted); }
  button.enter {
    grid-column: span 2;
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 1.05rem;
  }
  button.enter:active { background: var(--accent); opacity: 0.85; }

  .hint {
    margin: 12px 4px 0;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .stack li.new { animation: none; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main class="calc">
  <h1>Postfix calculator</h1>

  <section class="tape" aria-label="Stack">
    <ul class="stack" id="stack" aria-label="Stack, top of stack last"></ul>
    <div class="entry">
      <span class="level">in</span>
      <span class="typed" id="entry" aria-label="Number being typed"></span>
    </div>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </section>

  <section class="pad" aria-label="Keypad">
    <button class="stackop" data-act="clear">CLEAR</button>
    <button class="stackop" data-act="drop">DROP</button>
    <button class="stackop" data-act="swap">SWAP</button>
    <button class="op" data-op="/" aria-label="Divide">÷</button>

    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button class="op" data-op="*" aria-label="Multiply">×</button>

    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button class="op" data-op="-" aria-label="Subtract">−</button>

    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button class="op" data-op="+" aria-label="Add">+</button>

    <button data-digit="0">0</button>
    <button data-digit=".">.</button>
    <button data-act="negate" aria-label="Change sign">±</button>
    <button data-act="back" aria-label="Backspace">⌫</button>

    <button class="op" data-op="sqrt" aria-label="Square root">√</button>
    <button class="op" data-op="^" aria-label="Power">xʸ</button>
    <button class="enter" data-act="enter">ENTER</button>
  </section>

  <p class="hint">
    To compute 3 + 4: type 3, press Enter, type 4, press +.
    Keyboard: digits, Enter or Space to push, + − * / ^, Backspace, Esc to clear.
  </p>
</main>

<script>
  // ---------- State ----------
  const stack = [];      // LIFO: last element is the top of the stack
  let entry = "";        // number currently being typed
  let grew = false;      // did the last action push something? (drives animation)

  const stackEl = document.getElementById("stack");
  const entryEl = document.getElementById("entry");
  const messageEl = document.getElementById("message");

  // ---------- Operations ----------
  const binary = {
    "+": (a, b) => a + b,
    "-": (a, b) => a - b,
    "*": (a, b) => a * b,
    "/": (a, b) => {
      if (b === 0) throw new Error("Can't divide by zero.");
      return a / b;
    },
    "^": (a, b) => {
      const r = Math.pow(a, b);
      if (!Number.isFinite(r)) throw new Error("Result is not a real number.");
      return r;
    },
  };

  const unary = {
    sqrt: (a) => {
      if (a < 0) throw new Error("Can't take the square root of a negative number.");
      return Math.sqrt(a);
    },
  };

  const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷", "^": "xʸ", sqrt: "√" };

  // ---------- Helpers ----------
  function clean(x) {
    // trim floating-point noise such as 0.1 + 0.2
    return Number(x.toPrecision(12));
  }

  function fail(text) {
    messageEl.textContent = text;
    render();
    return false;
  }

  function clearMessage() { messageEl.textContent = ""; }

  // Move the typed number onto the stack. Returns false if it isn't a valid number.
  function commitEntry() {
    if (entry === "") return true;
    const n = parseFloat(entry);
    if (Number.isNaN(n)) return fail("Finish the number before continuing.");
    stack.push(n);
    entry = "";
    grew = true;
    return true;
  }

  // ---------- Actions ----------
  function typeChar(c) {
    clearMessage();
    if (entry.replace("-", "").length >= 15) return;
    if (c === ".") {
      if (entry.includes(".")) return;
      entry = entry === "" || entry === "-" ? entry + "0." : entry + ".";
    } else {
      if (entry === "0") entry = c;
      else if (entry === "-0") entry = "-" + c;
      else entry += c;
    }
    render();
  }

  function backspace() {
    clearMessage();
    entry = entry.slice(0, -1);
    if (entry === "-") entry = "";
    render();
  }

  function negate() {
    clearMessage();
    if (entry !== "") {
      entry = entry.startsWith("-") ? entry.slice(1) : "-" + entry;
    } else if (stack.length) {
      stack[stack.length - 1] = clean(-stack[stack.length - 1]);
    }
    render();
  }

  // Enter pushes the typed number. With nothing typed, it duplicates the top.
  function enter() {
    clearMessage();
    grew = false;
    if (entry !== "") {
      if (!commitEntry()) return;
    } else if (stack.length) {
      stack.push(stack[stack.length - 1]);
      grew = true;
    } else {
      return fail("Type a number first.");
    }
    render();
  }

  // Space pushes the typed number only (no duplicate).
  function push() {
    clearMessage();
    grew = false;
    if (entry !== "" && commitEntry()) render();
  }

  function applyOp(op) {
    clearMessage();
    grew = false;
    if (!commitEntry()) return;

    if (op in binary) {
      if (stack.length < 2) return fail(`${symbols[op]} needs two numbers on the stack.`);
      const b = stack.pop();
      const a = stack.pop();
      try {
        stack.push(clean(binary[op](a, b)));
        grew = true;
      } catch (e) {
        stack.push(a, b);   // put the operands back
        return fail(e.message);
      }
    } else {
      if (stack.length < 1) return fail(`${symbols[op]} needs a number on the stack.`);
      const a = stack.pop();
      try {
        stack.push(clean(unary[op](a)));
        grew = true;
      } catch (e) {
        stack.push(a);
        return fail(e.message);
      }
    }
    render();
  }

  function swap() {
    clearMessage();
    grew = false;
    if (!commitEntry()) return;
    if (stack.length < 2) return fail("Swap needs two numbers on the stack.");
    const b = stack.pop();
    const a = stack.pop();
    stack.push(b, a);
    render();
  }

  function drop() {
    clearMessage();
    grew = false;
    if (entry !== "") entry = "";
    else if (stack.length) stack.pop();
    render();
  }

  function clearAll() {
    clearMessage();
    grew = false;
    stack.length = 0;
    entry = "";
    render();
  }

  // ---------- Rendering ----------
  function render() {
    stackEl.innerHTML = "";

    if (stack.length === 0) {
      const p = document.createElement("li");
      p.className = "empty";
      p.style.display = "block";
      p.style.border = "none";
      p.textContent = "The stack is empty. Type a number and press Enter to push it.";
      stackEl.appendChild(p);
    }

    stack.forEach((value, i) => {
      const depth = stack.length - i;               // 1 = top of stack
      const li = document.createElement("li");
      if (depth === 1) {
        li.className = "top";
        if (grew) li.classList.add("new");
      }
      const level = document.createElement("span");
      level.className = "level";
      level.textContent = depth + ":";
      const val = document.createElement("span");
      val.className = "value";
      val.textContent = String(value);
      li.append(level, val);
      stackEl.appendChild(li);
    });

    stackEl.scrollTop = stackEl.scrollHeight;
    entryEl.textContent = entry;
    grew = false;
  }

  // ---------- Wiring: buttons ----------
  document.querySelector(".pad").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const { digit, op, act } = btn.dataset;
    if (digit !== undefined) typeChar(digit);
    else if (op) applyOp(op);
    else if (act === "enter") enter();
    else if (act === "negate") negate();
    else if (act === "back") backspace();
    else if (act === "swap") swap();
    else if (act === "drop") drop();
    else if (act === "clear") clearAll();
  });

  // ---------- Wiring: keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;

    if (/^[0-9]$/.test(k) || k === ".") typeChar(k);
    else if (k in binary) applyOp(k);
    else if (k === "Enter") enter();
    else if (k === " ") push();
    else if (k === "Backspace") backspace();
    else if (k === "Escape") clearAll();
    else return;

    e.preventDefault();
  });

  render();
</script>
</body>
</html>
